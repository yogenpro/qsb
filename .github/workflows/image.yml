name: Test and publish image
on:
  push:
    branches: [main]
    paths: ['qsb_capture/**', 'tests/**', 'Dockerfile', '.dockerignore', 'config/example.json', 'scripts/image-tags.py', 'deploy/image-base.json', 'pyproject.toml', '.github/workflows/image.yml']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run credential-free tests
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qsb-capture:ci
          provenance: false
      - name: Exercise the container without network or a writable root
        run: |
          docker run --rm --network none --read-only qsb-capture:ci --help
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 384m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=0700 \
            --entrypoint python qsb-capture:ci - < tests/container_smoke.py
  publish:
    needs: test
    if: github.repository == 'yogenpro/qsb' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity and select tags
        id: tags
        run: python3 scripts/image-tags.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/yogenpro/qsb
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '### Published image\n\n`ghcr.io/yogenpro/qsb@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
